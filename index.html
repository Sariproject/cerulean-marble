:root{

  --t-reg:#e9eeec; --t-reg-i:#35423f; --t-fri:#fdebc8; --t-fri-i:#7a4b00; --t-eve:#fde0cf; --t-eve-i:#8a3a10;
  --t-sat:#dce9fb; --t-sat-i:#1c4a8a; --t-hol:#f6dcdc; --t-hol-i:#8d2328; --t-oth:#e8e1f6; --t-oth-i:#4b3a85;

}

  --accent:#58c1a8; --accent-ink:#0c1512; --accent-soft:#1f3a33; --head:#212c29; --zebra:#1d2724;
  --input:#2b2815; --warn:#f0b866; --warn-bg:#3a2c12; --bad:#ff8b8e;
  --g1:#1b2c44; --g2:#1c3626; --g3:#3a2f15; --g4:#2e2447; --g5:#3d2020;
  --t-reg:#26322f; --t-reg-i:#c3d1cd; --t-fri:#443512; --t-fri-i:#f2c46c; --t-eve:#46281a; --t-eve-i:#f4a77c;
  --t-sat:#1d3150; --t-sat-i:#9cc0f2; --t-hol:#4a2326; --t-hol-i:#f29a9e; --t-oth:#2f2850; --t-oth-i:#bba9f0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#192220; --ink:#e6eeeb; --muted:#9db0ab; --line:#2c3a36; --line2:#222e2b;
  --accent:#58c1a8; --accent-ink:#0c1512; --accent-soft:#1f3a33; --head:#212c29; --zebra:#1d2724;

  --t-sat:#1d3150; --t-sat-i:#9cc0f2; --t-hol:#4a2326; --t-hol-i:#f29a9e; --t-oth:#2f2850; --t-oth-i:#bba9f0; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;direction:rtl;
  padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1360px;margin-inline:auto;display:flex;flex-direction:column;gap:18px;width:100%}
.wrap>*,.stack>*{min-width:0}

h1{font-size:21px;margin:0;font-weight:700;letter-spacing:-.2px}

.bar{width:100%;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-top:14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}

.top{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tabs button{font:inherit;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:9px 16px;cursor:pointer;font-weight:500;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}

.cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}

table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap;background:var(--surface)}

tr.grp+tr th{top:32px}
th.g1{background:var(--g1)} th.g2{background:var(--g2)} th.g3{background:var(--g3)} th.g4{background:var(--g4)} th.g5{background:var(--g5)}
td.n,th.n{text-align:center}
td.z{color:var(--muted);opacity:.55}
td.k,th.k{position:sticky;right:0;z-index:1;border-left:1px solid var(--line)}

th.k2{z-index:3}
td.big{font-weight:700}
tr:last-child td{border-bottom:0}
.dt{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12.5px;font-weight:500;background:var(--t-oth);color:var(--t-oth-i)}
.dt[data-t="רגיל"]{background:var(--t-reg);color:var(--t-reg-i)}
.dt[data-t="שישי"]{background:var(--t-fri);color:var(--t-fri-i)}
.dt[data-t="ערב חג"]{background:var(--t-eve);color:var(--t-eve-i)}
.dt[data-t="שבת"]{background:var(--t-sat);color:var(--t-sat-i)}
.dt[data-t="חג"],.dt[data-t="יום זיכרון"],.dt[data-t="יום העצמאות"]{background:var(--t-hol);color:var(--t-hol-i)}
.dt[data-t="חול המועד"]{background:var(--t-reg);color:var(--t-reg-i)}
input,select,button,textarea{font:inherit;color:var(--ink)}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--input);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0}
select{max-width:170px}
input[type=number]{width:84px}
td input[type=text]{width:130px}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:7px;padding:8px 16px;cursor:pointer;font-weight:700}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink);font-weight:500}
.btn.small{padding:3px 10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,select:focus-visible,input:focus-visible,.tabs button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:26px 18px;text-align:center;color:var(--muted);cursor:pointer;background:var(--bg);display:flex;flex-direction:column;gap:4px;align-items:center}
.drop b{color:var(--ink);font-size:15px}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.files{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:2px 6px 2px 12px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip button{border:0;background:none;color:inherit;cursor:pointer;padding:0 4px;font-size:14px}
details.warns{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px}
details.warns summary{cursor:pointer;font-weight:700}
.warns .w{padding:6px 0;border-top:1px solid rgba(128,128,128,.25);margin-top:6px;font-size:14px}
.tot td{font-weight:700;background:var(--head)!important}
.empty{color:var(--muted);padding:6px 0}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center}
.sub{color:var(--muted);font-size:11.5px;font-weight:400;display:block}
.rule{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line2)}
.rule:first-of-type{border-top:0}
textarea{width:100%;resize:vertical}
.row label{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#toast{position:fixed;inset-inline:0;bottom:max(16px,env(safe-area-inset-bottom,0px));margin-inline:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:8px;z-index:20}
</style>

<div class="wrap">
  <div class="bar">
    <div class="top">
      <h1>סיכום שכר חודשי</h1>
      <p class="muted small">הקבצים נקראים בדפדפן בלבד ולא נשלחים לשום מקום. ההגדרות נשמרות במחשב הזה.</p>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
  </div>
  <div id="view" class="stack"></div>
</div>
<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
(function(){
'use strict';
/* ---------- קבועים ---------- */
const IGNORE='(התעלם)';
const BUCKETS=[['reg','שעות רגילות'],['ot1','נוספות 1'],['ot2','נוספות 2'],['ot3','נוספות 3'],
  ['fri','שעות שישי (מהדוח)'],['sat','שעות שבת (מהדוח)'],['rest','שעות ללא תקן']];
const HOUR_TARGETS=['שעות עבודה נוכחות','75%','ש.נ 100%','ש.נ 125%','ש.נ 150%','ש.נ 175%','ש.נ 200%','כוננות','קריאה 100%','קריאה 125%'];
const ABS_TARGETS=['ימי חופשה','ימי מחלה'];
const WD=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const OUT_HEAD=['מספר עובד','שם משפחה','שם פרטי','מ.זהוי נוסף','מחלקה','קריאה 100%','קריאה 125%','ימי עבודה מכסה','שעות עבודה מכסה',
  'ימי עבודה נוכחות','שעות עבודה נוכחות','קיזוז שעות חוסר','כוננות','75%','ש.נ 100%','ש.נ 125%','ש.נ 150%','ש.נ 200%','ש.נ 175%',
  'ימי חופשה ','ימי\nמחלה ','משמרות 20%'];
const KEY='payroll-summary-v3';

function defaultSettings(){
  const m=(r,o1,o2,o3,f,s,x)=>({reg:r,ot1:o1,ot2:o2,ot3:o3,fri:f,sat:s,rest:x});
  const all=t=>m(t,t,t,t,t,t,t);
  return{
    dayTypes:[
      {name:'רגיל',quota:true,att:true,map:m('שעות עבודה נוכחות','ש.נ 100%','ש.נ 125%','ש.נ 150%',null,null,'ש.נ 100%')},
      {name:'שישי',quota:false,att:false,map:all('ש.נ 175%')},
      {name:'ערב חג',quota:false,att:false,map:all('ש.נ 175%')},
      {name:'שבת',quota:false,att:false,map:all('ש.נ 175%')},
      {name:'חג',quota:false,att:false,map:all('ש.נ 175%')},
      {name:'חול המועד',quota:true,att:true,map:m('שעות עבודה נוכחות','ש.נ 100%','ש.נ 125%','ש.נ 150%',null,null,'ש.נ 100%')},
      {name:'יום זיכרון',quota:false,att:false,map:all('ש.נ 175%')},
      {name:'יום העצמאות',quota:false,att:false,map:all('ש.נ 175%')}],
    calendar:{}, employees:{},
    abs:[{kind:'קוד',val:'2',target:'ימי חופשה'},{kind:'טקסט',val:'חופשה',target:'ימי חופשה'},{kind:'טקסט',val:'מחלה',target:'ימי מחלה'}],
    ver:6,general:{hpd:4,round:2,shift20:true,half:true,halfMin:10,fullMin:35},
    rules:{attAll:true,special:{on:true,high:'ש.נ 175%',low:'75%'},notes:{}}
  };
}
let S=defaultSettings();
try{const raw=localStorage.getItem(KEY); if(raw){const p=JSON.parse(raw); if(p&&p.dayTypes){S=Object.assign(defaultSettings(),p);S.ver=p.ver||0}}}catch(e){}
S.general=Object.assign({half:true,halfMin:10,fullMin:35},S.general);if(S.general.ver_r!==2){S.general.halfMin=10;S.general.fullMin=35;S.general.ver_r=2}S.rules=Object.assign({attAll:true,notes:{}},S.rules||{});S.rules.special=Object.assign({on:true,high:'ש.נ 175%',low:'75%'},S.rules.special||{});S.rules.notes=S.rules.notes||{};
if((S.ver||0)<5){const t=S.dayTypes.find(x=>x.name==='רגיל');if(t){t.map.ot1='ש.נ 100%';t.map.ot2='ש.נ 125%';t.map.ot3='ש.נ 150%';t.map.rest='ש.נ 100%'}S.ver=5}
if((S.ver||0)<6){const mk=(n,q,a,src)=>{if(!S.dayTypes.some(x=>x.name===n)){const b=S.dayTypes.find(x=>x.name===src)||S.dayTypes[0];S.dayTypes.push({name:n,quota:q,att:a,map:Object.assign({},b.map)})}};mk('חול המועד',true,true,'רגיל');mk('יום זיכרון',false,false,'חג');mk('יום העצמאות',false,false,'חג');S.ver=6;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- תאריכים ---------- */
const iso=(y,m,d)=>y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
const asDate=s=>new Date(s+'T12:00:00Z');
const toIso=d=>iso(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate());
const addDays=(s,n)=>{const d=asDate(s);d.setUTCDate(d.getUTCDate()+n);return toIso(d)};
const wdOf=s=>asDate(s).getUTCDay();
const fmt=s=>s.slice(8)+'/'+s.slice(5,7)+'/'+s.slice(0,4);
const fmtShort=s=>s.slice(8)+'/'+s.slice(5,7);
function parseDate(v){
  if(typeof v==='string'){const m=v.match(/^\s*(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})\s*$/);if(m)return iso(+m[3],+m[2],+m[1])}
  if(typeof v==='number'&&v>30000&&v<80000){const p=XLSX.SSF.parse_date_code(v);return iso(p.y,p.m,p.d)}
  if(v instanceof Date)return iso(v.getFullYear(),v.getMonth()+1,v.getDate());
  return null;
}
function hebParts(s){
  const p=new Intl.DateTimeFormat('en-u-ca-hebrew',{timeZone:'UTC',day:'numeric',month:'long'}).formatToParts(asDate(s));
  return{d:+p.find(x=>x.type==='day').value,m:p.find(x=>x.type==='month').value};
}
function holidayName(s){
  try{
    const {d,m}=hebParts(s);
    if(m==='Tishri'&&(d===1||d===2))return 'ראש השנה';
    if(m==='Tishri'&&d===10)return 'יום כיפור';
    if(m==='Tishri'&&d===15)return 'סוכות';
    if(m==='Tishri'&&d===22)return 'שמיני עצרת / שמחת תורה';
    if(m==='Nisan'&&(d===15||d===21))return 'פסח';
    if(m==='Sivan'&&d===6)return 'שבועות';
  }catch(e){}
  return null;
}
function memName(s){
  try{
    const {d,m}=hebParts(s);
    if(m==='Nisan'&&d>=26&&d<=28){const b=addDays(s,27-d),w=wdOf(b),x=w===5?addDays(b,-1):w===0?addDays(b,1):b;if(x===s)return 'יום הזיכרון לשואה ולגבורה'}
    if(m==='Iyar'&&d>=3&&d<=6){const b=addDays(s,5-d),w=wdOf(b),x=w===6?addDays(b,-2):w===5?addDays(b,-1):w===1?addDays(b,1):b;
      if(x===s)return 'יום העצמאות';if(addDays(x,-1)===s)return 'יום הזיכרון לחללי צה"ל'}
  }catch(e){}
  return null;
}
function moedName(s){
  try{const {d,m}=hebParts(s);
    if(m==='Tishri'&&d>=16&&d<=21)return 'חול המועד סוכות';
    if(m==='Nisan'&&d>=16&&d<=20)return 'חול המועד פסח';
  }catch(e){}
  return null;
}
const CHAIN=['שבת','חג','יום זיכרון','יום העצמאות'];
const hasType=n=>S.dayTypes.some(t=>t.name===n);
function autoType(s){
  const h=holidayName(s);
  if(h&&hasType('חג'))return{type:'חג',note:h};
  const mm=memName(s);
  if(mm&&mm!=='יום העצמאות'&&hasType('יום זיכרון'))return{type:'יום זיכרון',note:mm};
  if(mm==='יום העצמאות'&&hasType('יום העצמאות'))return{type:'יום העצמאות',note:mm};
  const e=holidayName(addDays(s,1));
  if(e&&hasType('ערב חג'))return{type:'ערב חג',note:'ערב '+e};
  const w=wdOf(s);
  if(w===5&&hasType('שישי'))return{type:'שישי',note:''};
  if(w===6&&hasType('שבת'))return{type:'שבת',note:''};
  const mo=moedName(s);
  if(mo&&hasType('חול המועד'))return{type:'חול המועד',note:mo};
  return{type:S.dayTypes[0]?S.dayTypes[0].name:'רגיל',note:''};
}
const effType=s=>(S.calendar[s]&&S.calendar[s].type)||autoType(s).type;

/* ---------- קריאת דוחות ---------- */
const norm=s=>s==null?'':String(s).replace(/\s+/g,'');
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
function parseReport(rows,fname){
  let hi=-1,cols={};
  for(let i=0;i<rows.length;i++){
    const names=(rows[i]||[]).map(norm);
    if(names.includes('היום')&&names.includes('סהכשעות')){hi=i;names.forEach((n,j)=>{if(n)cols[n]=j});break}
  }
  if(hi<0)throw new Error('לא נמצאה שורת כותרות (היום / סהכ שעות)');
  const c=k=>{for(const o of [].concat(k))if(o in cols)return cols[o];return null};
  const ix={std:c('תקן'),name:c('שםהעובד'),num:c('מספרעובד'),absn:c('סוגהעדרות'),deficit:c(["ש'חוסר",'שחוסר']),sat:c('שעותשבת'),fri:c('שעותשישי'),
    ot3:c('נוספות3'),ot2:c('נוספות2'),ot1:c('נוספות1'),reg:c('שעותרגילות'),total:c('סהכשעות'),day:c('היום')};
  const tx=['יציאה2','כניסה2','יציאה1','כניסה1'].map(c).filter(x=>x!=null);
  const g=(r,k)=>ix[k]!=null?r[ix[k]]:null;
  const emps=[];let cur=null;
  for(const r of rows.slice(hi+1)){
    if(!r)continue;
    const d=parseDate(g(r,'day'));
    if(!d){
      const n=g(r,'num'),nm=g(r,'name');
      if(n!=null&&n!==''&&String(nm||'').trim()){cur={number:Math.round(num(n)),name:String(nm).replace(/\s+/g,' ').trim(),src:fname,days:[]};emps.push(cur)}
      continue;
    }
    if(!cur)throw new Error('שורת יום לפני שורת עובד');
    cur.days.push({date:d,std:num(g(r,'std')),absCode:Math.round(num(g(r,'absn'))),deficit:num(g(r,'deficit')),sat:num(g(r,'sat')),fri:num(g(r,'fri')),
      ot3:num(g(r,'ot3')),ot2:num(g(r,'ot2')),ot1:num(g(r,'ot1')),reg:num(g(r,'reg')),total:num(g(r,'total')),
      texts:tx.map(j=>r[j]).filter(v=>v!=null&&String(v).trim()!=='').map(v=>String(v).trim())});
  }
  return emps;
}
let REPORTS=[];   // {file, emps}
let PREV=[];      // דוחות תקופה קודמת, לרצף בלבד
let ERRORS=[];

/* ---------- חישוב ---------- */
const halfRound=x=>{const m=Math.round(x*60),w=Math.floor(m/60),r=m%60,a=+S.general.halfMin,b=+S.general.fullMin;return r<a?w:(r<b?w+0.5:w+1)};
const rnd=(x,n)=>{const f=Math.pow(10,n);return Math.round((x+1e-9)*f)/f};
function compute(){
  const emps=REPORTS.flatMap(r=>r.emps);
  if(!emps.length)return null;
  const warnings=[...ERRORS];
  let start='9999',end='0000';
  emps.forEach(e=>e.days.forEach(d=>{if(d.date<start)start=d.date;if(d.date>end)end=d.date}));
  let quota=0;const missing=[];
  for(let d=start;d<=end;d=addDays(d,1)){
    let t=S.calendar[d]&&S.calendar[d].type;
    if(!t){t=autoType(d).type;missing.push(d)}
    const def=S.dayTypes.find(x=>x.name===t);
    if(!def)warnings.push({kind:'לוח',msg:`סוג היום "${t}" (${fmt(d)}) לא מוגדר בלשונית סוגי יום`});
    else if(def.quota)quota++;
  }
  if(missing.length)warnings.push({kind:'לוח',msg:`${missing.length} תאריכים בתקופה לא אושרו בלוח החודשי. נעשה שימוש בברירת מחדל לפי יום בשבוע וחגים. בדקו בלשונית "לוח חודשי".`,fix:true});
  const results=[],detail=[],seen={};
  const holRe=/ר"ה|חג|כיפ|סוכות|פסח|שבועות|שמיני|חול המוע/;
  const hol=new Set();
  for(const e of emps){
    if(seen[e.number])warnings.push({kind:'קבצים',msg:`עובד ${e.number} מופיע ביותר מקובץ אחד (${seen[e.number]}, ${e.src})`});
    seen[e.number]=e.src;
    let info=S.employees[e.number];
    if(!info){const p=e.name.split(' ');info=S.employees[e.number]={family:p.length>1?p.slice(1).join(' '):'',first:p[0],extra:'',dept:'',hpd:'',quotaOverride:''};save()}
    const hpd=info.hpd!==''&&info.hpd!=null?+info.hpd:+S.general.hpd;
    const qd=info.quotaOverride!==''&&info.quotaOverride!=null?+info.quotaOverride:quota;
    const res={number:e.number,name:e.name,hours:{},att:0,deficit:0,abs:{},quota:qd,hpd};
    const ds=e.days.map(d=>d.date);
    if(Math.min(...ds.map(x=>+x.replace(/-/g,'')))!==+start.replace(/-/g,'')||Math.max(...ds.map(x=>+x.replace(/-/g,'')))!==+end.replace(/-/g,''))
      warnings.push({kind:'קבצים',msg:`תקופת הדוח של ${e.name} שונה משאר העובדים`});
    const byDate={};e.days.forEach(d=>byDate[d.date]=d);
    PREV.flatMap(q=>q.emps).filter(x=>x.number===e.number).forEach(pe=>pe.days.forEach(d=>{if(!byDate[d.date])byDate[d.date]=d}));
    const ATT='שעות עבודה נוכחות',SP=S.rules.special,paid={};
    Object.values(byDate).filter(d=>d.date<start).sort((a,b)=>a.date<b.date?-1:1).forEach(d=>{const t=effType(d.date);
      if(CHAIN.includes(t)&&d.total>0){const pv=byDate[addDays(d.date,-1)];if(pv&&pv.total>0&&(['שישי','ערב חג'].includes(effType(pv.date))||paid[pv.date]))paid[d.date]=true}});
    for(const r of e.days.slice().sort((a,b)=>a.date<b.date?-1:1)){
      const typ=effType(r.date),def=S.dayTypes.find(x=>x.name===typ);
      if(!def)continue;
      let ov=null;
      if(SP.on&&CHAIN.includes(typ)&&r.total>0){
        const pv=byDate[addDays(r.date,-1)];
        const ok=pv&&pv.total>0&&(['שישי','ערב חג'].includes(effType(pv.date))||paid[pv.date]);
        if(ok){ov=SP.high;paid[r.date]=true}else ov=SP.low;
        if(!pv&&r.date===start)warnings.push({kind:'רצף',msg:`היום הראשון בדוח של ${e.name} (${fmtShort(r.date)}, ${typ}) הוא שבת/חג, והיום שלפניו לא נמצא בדוח הזה. נחשב ${SP.low}. אם עבדה ביום שלפניו, יש לבדוק ידנית.`})
      }
      if(['רגיל','שישי','שבת'].includes(typ)&&r.texts.some(t=>holRe.test(t))){
        const k=r.date;if(!hol.has(k)){hol.add(k);warnings.push({kind:'לוח',msg:`בדוח מופיע "${r.texts.filter(t=>holRe.test(t)).join(' ')}" בתאריך ${fmtShort(r.date)} אבל סוג היום בלוח הוא "${typ}"`})}
      }
      const b={reg:r.reg,ot1:r.ot1,ot2:r.ot2,ot3:r.ot3,fri:r.fri,sat:r.sat};
      b.rest=Math.max(0,r.total-Object.values(b).reduce((a,x)=>a+x,0));
      const row={emp:e.number,name:e.name,date:r.date,typ,total:r.total,h:{},abs:''};
      for(const k in b){if(b[k]<=0)continue;const t=ov||def.map[k];if(t&&t!==IGNORE&&!(S.rules.attAll&&t===ATT)){res.hours[t]=(res.hours[t]||0)+b[k];row.h[t]=(row.h[t]||0)+b[k]}}
      if(S.rules.attAll&&r.total>0){res.hours[ATT]=(res.hours[ATT]||0)+r.total;row.h[ATT]=(row.h[ATT]||0)+r.total}
      if(ov)row.ov=ov;
      if(def.att)res.deficit+=r.deficit;
      let at=null;
      for(const a of S.abs){
        if(a.kind==='קוד'&&+a.val===r.absCode&&r.absCode){at=a.target;break}
        if(a.kind==='טקסט'&&a.val&&r.texts.some(t=>t.includes(a.val))){at=a.target;break}
      }
      if(at){if(def.att){res.abs[at]=(res.abs[at]||0)+1;row.abs=at}}
      else if(r.absCode)warnings.push({kind:'העדרויות',msg:`קוד העדרות ${r.absCode} (עובד ${e.number}, ${fmtShort(r.date)}) לא מוגדר`});
      if(def.att&&r.total>0&&!at){res.att++;row.att=1}
      {
        const special=!def.att,std=r.std,over=special?0:Math.max(0,r.total-std),t2=rnd(r.total,2);
        row.std=special?0:std;row.over=over;row.def=special?0:r.deficit;
        const tg=Object.keys(row.h).filter(k=>k!==ATT);
        const tgd=Object.entries(row.h).filter(([k])=>k!==ATT).map(([k,v])=>rnd(v,2)+' ← '+k);
        let calc;
        const att=(S.rules.attAll&&r.total>0)?' | שעות נוכחות: '+t2:'';
        const cols=tgd.length?' | '+tgd.map(x=>{const q=x.split(' ← ');return q[1]+': '+q[0]}).join(' | '):'';
        if(r.total<=0)calc=at?('העדרות: '+at):'אין שעות';
        else if(special)calc='סה"כ '+t2+cols+att;
        else if(std>0)calc='תקן '+std+(over>0.004?' + מעל התקן '+rnd(over,2):'')+(r.deficit>0.004?' − חוסר '+rnd(r.deficit,2):'')+' = סה"כ '+t2+cols+att;
        else calc='אין תקן, הכול מעל התקן: סה"כ '+t2+cols+att;
        row.calc=calc;
      }
      detail.push(row);
    }
    results.push(res);
  }
  results.sort((a,b)=>a.number-b.number);
  return{results,detail,start,end,warnings};
}
function outRow(res){
  const i=S.employees[res.number],n=S.general.round,h=t=>(S.general.half?halfRound(res.hours[t]||0):rnd(res.hours[t]||0,n))||'';
  return[res.number,i.family||'',i.first||'',i.extra||'',i.dept||'',h('קריאה 100%'),h('קריאה 125%'),res.quota,'',res.att,h('שעות עבודה נוכחות'),
    rnd(res.deficit,n)||'',h('כוננות'),h('75%'),h('ש.נ 100%'),h('ש.נ 125%'),h('ש.נ 150%'),h('ש.נ 200%'),h('ש.נ 175%'),res.abs['ימי חופשה']||'',res.abs['ימי מחלה']||'',''];
}

function importEmps(buf){
  const wb=XLSX.read(buf,{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
  const nm=v=>String(v).replace(/\s+/g,'').replace(/["'״׳.]/g,'');
  let hi=rows.findIndex(r=>r.some(c=>nm(c).includes('מספרעובד')||nm(c)==='מספר'));
  const col={num:0,family:1,first:2,extra:3,dept:4};
  if(hi>=0){rows[hi].forEach((c,j)=>{const x=nm(c);
    if(x.includes('מספרעובד')||x==='מספר')col.num=j;
    else if(x.includes('משפחה'))col.family=j;
    else if(x.includes('פרטי'))col.first=j;
    else if(x.includes('זיהוי')||x.includes('זהוי')||x.includes('זהות')||x.includes('נוסף'))col.extra=j;
    else if(x.includes('מחלקה'))col.dept=j})}
  let n=0;
  rows.slice(hi+1).forEach(r=>{const k=parseInt(r[col.num]);if(!k||k<=0)return;
    const o=S.employees[k]||(S.employees[k]={family:'',first:'',extra:'',dept:'',hpd:'',quotaOverride:''});
    ['family','first','extra','dept'].forEach(f=>{const v=r[col[f]];if(v!==''&&v!=null)o[f]=String(v).trim()});n++});
  return n;
}

async function addFiles(list,prev){
  for(const f of list){
    try{
      const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:null});
      const emps=parseReport(rows,f.name);
      if(!emps.length)throw new Error('לא נמצא עובד בקובץ');
      if(prev){PREV=PREV.filter(r=>r.file!==f.name);PREV.push({file:f.name,emps})}
      else{REPORTS=REPORTS.filter(r=>r.file!==f.name);REPORTS.push({file:f.name,emps})}
    }catch(e){ERRORS.push({kind:'קבצים',msg:`${f.name}: ${e.message}`})}
  }
  render();
}

view.addEventListener('change',e=>{

  if(t.id==='imp'){const f=t.files[0];if(f)f.text().then(x=>{try{const p=JSON.parse(x);if(!p.dayTypes)throw 0;S=Object.assign(defaultSettings(),p);save();render();toast('ההגדרות יובאו')}catch(_){toast('קובץ הגדרות לא תקין')}});return}
  if(t.id==='g-hpd'){S.general.hpd=+t.value||4;save();return}
  if(t.id==='g-round'){S.general.round=Math.max(0,Math.min(4,+t.value||0));save();return}
  if(t.id==='g-half'){S.general.half=t.checked;save();return}
  if(t.id==='g-hmin'){S.general.halfMin=Math.max(1,Math.min(59,+t.value||10));save();render();return}
  if(t.id==='g-fmin'){S.general.fullMin=Math.max(1,Math.min(59,+t.value||35));save();render();return}
  if(t.id==='g-s20'){S.general.shift20=t.checked;save();return}
  if(d.rule==='attAll'){S.rules.attAll=t.checked;save();return}
  if(d.rule==='special'){S.rules.special[d.f]=d.f==='on'?t.checked:t.value;save();return}
  if(d.qt!=null){const ty=S.dayTypes[+d.qt];const v=t.value===IGNORE?null:t.value;Object.keys(ty.map).forEach(k=>ty.map[k]=v);save();return}
  if(d.note){S.rules.notes[d.note]=t.value;save();return}
  if(d.cal){const ex=S.calendar[d.cal]||Object.assign({},autoType(d.cal));ex[d.f]=t.value;S.calendar[d.cal]=ex;save();if(d.f==='type')render();return}
  if(d.ti!=null){const ty=S.dayTypes[+d.ti];
    if(d.f==='name'){const old=ty.name;ty.name=t.value.trim()||old;Object.values(S.calendar).forEach(c=>{if(c.type===old)c.type=ty.name})}
    else if(d.f==='map')ty.map[d.b]=t.value===IGNORE?null:t.value;

  if(d.ai!=null){S.abs[+d.ai][d.f]=t.value;save();return}
});
view.addEventListener('click',async e=>{
  const rmp=e.target.closest('[data-rmp]');if(rmp){PREV.splice(+rmp.dataset.rmp,1);render();return}
  const rm=e.target.closest('[data-rm]');if(rm){REPORTS.splice(+rm.dataset.rm,1);render();return}

    let s,e2;

    save();toast('הלוח נשמר')}
  else if(a==='resetrange'){for(let d=CAL.from;d<=CAL.to;d=addDays(d,1))delete S.calendar[d];save()}
  else if(a==='prevm'||a==='nextm'){const n=a==='prevm'?-1:1;const sh=s=>{const d=asDate(s);d.setUTCMonth(d.getUTCMonth()+n);return toIso(d)};CAL.from=sh(CAL.from);CAL.to=sh(CAL.to)}
  else if(a==='addtype'){S.dayTypes.push({name:'סוג חדש',quota:false,att:false,map:{reg:null,ot1:null,ot2:null,ot3:null,fri:null,sat:null,rest:null}});save()}
  else if(a==='deltype'){S.dayTypes.splice(i,1);save()}

  else if(a==='copyq'){const txt=qSummary();try{await navigator.clipboard.writeText(txt);toast('הסיכום הועתק')}catch(_){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('הסיכום הועתק')}catch(__){toast('ההעתקה נכשלה')}ta.remove()}return}
  else if(a==='exp'){const d=await getDl();if(d)d.save({filename:'הגדרות_שכר.json',data:JSON.stringify(S,null,1)}).catch(()=>{});else toast('שמירת קבצים לא זמינה כאן');return}
  else if(a==='reset'){if(b.dataset.sure){S=defaultSettings();save()}else{b.dataset.sure='1';b.textContent='לחצו שוב לאישור';return}}
  render();
});

async function download(){
  const R=compute();if(!R)return;
  const dl=await getDl();
  if(!dl){toast('הורדת קבצים לא זמינה בתצוגה הזו. פתחו את הקישור בדפדפן רגיל.');return}
  const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet('Sheet1',{views:[{rightToLeft:true}]});
  const hr=ws.addRow(OUT_HEAD);hr.font={bold:true};hr.alignment={horizontal:'right',vertical:'middle',wrapText:true};
  R.results.forEach((r,i)=>{
    const v=outRow(r),n=i+2;
    v[8]={formula:`H${n}*${r.hpd}`,result:rnd(r.quota*r.hpd,S.general.round)};
    if(S.general.shift20)v[21]={formula:`K${n}`,result:v[10]===''?0:v[10]};
    ws.addRow(v);
  });
  ws.columns.forEach((c,i)=>c.width=[8,13,10,11,16][i]||7.5);
  const pg=(w,h)=>{w.pageSetup={paperSize:9,orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0,horizontalCentered:true,margins:{left:0.3,right:0.3,top:0.5,bottom:0.5,header:0.2,footer:0.2}};w.headerFooter={oddFooter:'&Cעמוד &P מתוך &N'};w.views=[{rightToLeft:true,state:'frozen',ySplit:1}];w.getRow(1).height=h;w.pageSetup.printTitlesRow='1:1'};
  pg(ws,48);
  const wd=wb.addWorksheet('פירוט יומי',{views:[{rightToLeft:true}]});
  wd.addRow(['מספר עובד','שם','תאריך','יום','סוג יום','תקן','שעות בפועל','מעל התקן (100%)','חוסר','העדרות',...HOUR_TARGETS,'חישוב']).font={bold:true};
  R.detail.forEach(d=>wd.addRow([d.emp,d.name,fmt(d.date),WD[wdOf(d.date)],d.typ,d.std||'',rnd(d.total,2)||'',rnd(d.over,2)||'',rnd(d.def,2)||'',d.abs,...HOUR_TARGETS.map(t=>rnd(d.h[t]||0,2)||''),d.calc]));
  wd.columns.forEach(c=>c.width=14);pg(wd,32);wd.getColumn(HOUR_TARGETS.length+11).width=70;
  const ww=wb.addWorksheet('אזהרות',{views:[{rightToLeft:true}]});
  ww.addRow(['נושא','הודעה']).font={bold:true};
  (R.warnings.length?R.warnings:[{kind:'-',msg:'אין אזהרות'}]).forEach(w=>ww.addRow([w.kind,w.msg]));
  pg(ww,20);
  ww.getColumn(1).width=12;ww.getColumn(2).width=110;
  const buf=await wb.xlsx.writeBuffer();
  const fname='סיכום_'+R.end.slice(5,7)+'-'+R.end.slice(0,4)+'.xlsx';
  dl.save({filename:fname,data:new Blob([buf])}).then(()=>toast('הקובץ נשמר')).catch(err=>{if(err&&err.code!=='declined')toast('השמירה נכשלה')});
}

window.__test={importEmps:(b)=>{const n=importEmps(b);return[n,JSON.stringify(S.employees)]},setPrev:(r)=>{PREV=r},outRow,render:()=>render(),setReports:(r)=>{REPORTS=r},holidayName,autoType,parseReport,compute:()=>compute()};
render();
})();
